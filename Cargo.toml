[package]
name = "factorial_engine"
version = "0.5.0"
edition = "2024"
authors = ["Neil Crago"]
description = "A high-performance, zero-error Rust crate for computing the prime factorization of factorials (n!). It includes Symbolic Factorials, Symbolic Arithmetic, Deterministic Primality Testing, BigUint Support, Reverse Factorial and a Clean API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Neil-Crago/factorial_engine"
documentation = "https://docs.rs/factorial_engine"
readme = "README.md"
keywords = ["mathematics", "factorial", "legendre", "gamma", "stirling"]
categories = ["mathematics", "algorithms"]

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
